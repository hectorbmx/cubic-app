<ion-content [fullscreen]="true" class="login-bg">
  <div class="login-wrapper">

    <div class="brand">
      <img class="brand-logo" src="assets/img/cubic33-logo.png" alt="CUBIC33" />
    </div>

    <div class="login-card">
      <p class="login-subtitle">Set a new password</p>

      <div class="form">
        <label class="field-label">6-digit code:</label>
        <div class="input-row">
          <div class="input-icon-box">
            <ion-icon name="key-outline"></ion-icon>
          </div>

          <input
            class="text-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="123456"
            [(ngModel)]="code"
          />
        </div>

        <label class="field-label">New password:</label>
        <div class="input-row">
          <div class="input-icon-box">
            <ion-icon name="lock-closed-outline"></ion-icon>
          </div>

          <input
            class="text-input"
            type="password"
            autocomplete="new-password"
            placeholder="********"
            [(ngModel)]="password"
          />
        </div>

        <label class="field-label">Confirm password:</label>
        <div class="input-row">
          <div class="input-icon-box">
            <ion-icon name="lock-closed-outline"></ion-icon>
          </div>

          <input
            class="text-input"
            type="password"
            autocomplete="new-password"
            placeholder="********"
            [(ngModel)]="password_confirmation"
          />
        </div>

        <button class="primary-btn" (click)="submit()" [disabled]="loading || !rid">
          {{ loading ? 'Saving...' : 'Change password' }}
        </button>

        <a class="link-back" (click)="goBack($event)">Back to login</a>
      </div>
    </div>

  </div>
</ion-content>
