  <div class="obra-selector-wrapper">

  <!-- SELECT CLIENTE -->
<select
  *ngIf="(clientes?.length || 0) > 1"
  class="native-select"
  [(ngModel)]="clienteIdSeleccionado"
  (ngModelChange)="onClienteChange()"
>
  <option [ngValue]="null" disabled>Selecciona un cliente</option>
  <option
    *ngFor="let cliente of clientes; trackBy: trackByCliente"
    [ngValue]="cliente.id"
  >
    {{ cliente.name }}
  </option>
</select>

  <!-- SELECT OBRAS -->
<select
  *ngIf="obrasFiltradas.length > 0"
  class="native-select"
  [(ngModel)]="obraIdSeleccionada"
  (ngModelChange)="onObraChange()"
>
  <option [ngValue]="null" disabled>Selecciona una obra</option>
  <option
    *ngFor="let obra of obrasFiltradas; trackBy: trackByFn"
    [ngValue]="obra.id"
  >
    {{ obra.name || obra.nombre || ('Obra #' + obra.id) }}
  </option>
</select>

  <!-- MENSAJE CUANDO NO HAY OBRAS -->
  <div *ngIf="!loadingObras && obras.length > 0 && obrasFiltradas.length === 0" class="loading-text">
    No hay obras para este cliente.
  </div>

  <!-- LOADING -->
  <div *ngIf="loadingObras && obras.length === 0" class="loading-text">
    Cargando obras...
  </div>

</div>
  
<!-- Grid de Opciones -->
<div class="options-grid">
  <div class="option-card" (click)="openSection('info')">
    <ion-icon name="stats-chart-outline"></ion-icon>
    <p>General<br>Info</p>
  </div>
  
  <div class="option-card" (click)="openSection('timeline')">
    <ion-icon name="calendar-outline"></ion-icon>
    <p>Timeline</p>
  </div>

  <div class="option-card" (click)="openSection('camaras')">
    <ion-icon name="videocam-outline"></ion-icon>
    <p>Works<br>Cameras</p>
  </div>
  
  <div class="option-card option-card--renders" (click)="openSection('fotos')">
    <!-- <ion-icon name="camera-outline"></ion-icon> -->
     <!-- <ion-icon src="assets/icons/camera.svg" class="icon-svg"></ion-icon> -->
    <img src="assets/icons/camera.svg" class="icon-img" alt="camera" />

    <p>3D /Renders</p>
  </div>

  <div class="option-card" (click)="openSection('planos')">
         <ion-icon src="assets/icons/Photos.svg" class="icon-svg"></ion-icon>
    <p>Drawings</p>
  </div>
  
  <div class="option-card" (click)="openSection('informes')">
    <ion-icon name="document-text-outline"></ion-icon>
    <p>Reports</p>
  </div>

</div>
