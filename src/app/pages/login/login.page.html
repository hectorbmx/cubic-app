<ion-content [fullscreen]="true" class="login-bg">
  <div class="container">
    <!-- Logo -->
    <div class="logo-section">
      <img src="assets/logo.png" alt="Cubic33 Group" class="logo">
      <p class="welcome-subtitle">Ingresa tus credenciales para ingresar</p>
    </div>

    <!-- Formulario de Login -->
    <div class="login-form">
      <div class="field">
        <label>Correo Electrónico:</label>
        <ion-item lines="none" class="input-item">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input 
            type="email" 
            [(ngModel)]="email" 
            placeholder="marketing@cubic33group.com">
          </ion-input>
        </ion-item>
      </div>

      <div class="field">
        <label>Contraseña:</label>
        <ion-item lines="none" class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input 
            type="password" 
            [(ngModel)]="password" 
            placeholder="••••••••">
          </ion-input>
        </ion-item>
      </div>

      <div class="row">
        <div class="remember-container">
          <ion-checkbox [(ngModel)]="remember"></ion-checkbox>
          <span class="remember-text">Recuérdame</span>
        </div>
        <a class="link">¿Olvidaste tu contraseña?</a>
      </div>

      <ion-button expand="block" class="primary-btn" [disabled]="loading" (click)="submit()">
        {{ loading ? 'ingresando…' : 'iniciar sesión' }}
      </ion-button>

      <div class="foot">
        <span>¿Eres nuevo?</span> 
        <a class="link" (click)="goToRegister()">Regístrate aquí</a>
      </div>

      <ion-text color="danger" class="error-message" *ngIf="error">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ error }}
      </ion-text>
    </div>
  </div>
</ion-content>
